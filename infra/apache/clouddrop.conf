# Apache HTTP Server (httpd) Reverse Proxy Configuration for CloudDrop
# Put this in /etc/httpd/conf.d/clouddrop.conf on Amazon Linux 2023 EC2 instances

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    ServerName _

    # Enable Reverse Proxy modules
    ProxyPreserveHost On
    ProxyRequests Off

    # Proxy Swagger OpenAPI Documentation
    ProxyPass /api/docs http://127.0.0.1:3000/api/docs
    ProxyPassReverse /api/docs http://127.0.0.1:3000/api/docs

    # Proxy API endpoints to NestJS Backend Docker Container
    ProxyPass /api http://127.0.0.1:3000/api
    ProxyPassReverse /api http://127.0.0.1:3000/api

    # NLB Health Check endpoint
    ProxyPass /health http://127.0.0.1:3000/health
    ProxyPassReverse /health http://127.0.0.1:3000/health

    # Default root forwards to frontend static build or backend status
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # Logging
    ErrorLog /var/log/httpd/clouddrop_error.log
    CustomLog /var/log/httpd/clouddrop_access.log combined
</VirtualHost>

